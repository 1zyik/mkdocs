# ----------------------------------------------------------------------------
# Sedtion for configuring project
# ----------------------------------------------------------------------------
[project]
site_name = "T1nk3r"
site_description = "Just a bunch of personal docs i keep updating."
site_author = "1zyik"
site_url = "https://1zyik.github.io/t1nk3r/"
copyright = """
Copyright &copy; 2026 Isaac Adepitan
"""
# Navigation Setup Guide -> https://zensical.org/docs/setup/navigation/
#nav = [
#  { "Welcome" = "index.md" },
#  {"Linux" = [
#     "linux/000-index.md"
 # ]}
#]
#extra_css = ["stylesheets/extra.css"]
#extra_javascript = ["javascripts/extra.js"]
repo_url = "https://github.com/1zyik/t1nk3r"
repo_name = "1zyik/t1nk3r"


# ----------------------------------------------------------------------------
# Section for configuring theme options
# ----------------------------------------------------------------------------
[project.theme]
#favicon = "images/favicon.png"
language = "en"
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    # "header.autohide",
    # "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    #"navigation.prune",
    "navigation.sections",
    #"navigation.tabs",
    #"navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    # "toc.follow",
    #"toc.integrate",
]

# ----------------------------------------------------------------------------
# Configure different color schemes
# ----------------------------------------------------------------------------
# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Configure fonts
# ----------------------------------------------------------------------------
[project.theme.font]
text = "Manrope"
code = "Jetbrains Mono"

# ----------------------------------------------------------------------------
# You can configure icons
# ----------------------------------------------------------------------------
[project.theme.icon]
repo = "fontawesome/brands/git-alt"
logo = "lucide/rocket"

# ----------------------------------------------------------------------------
# The "extra" section contains miscellaneous settings.
# ----------------------------------------------------------------------------
[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github-alt"
link = "https://github.com/1zyik"

[[project.extra.social]]
icon = "fontawesome/brands/youtube"
link = "https://github.com/1zyik"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/isaac-adepitan/"

[project.extra.consent]
title = "Cookie consent"
description = """
    We use cookies to recognize your repeated visits and preferences, as well
    as to measure the effectiveness of our documentation and whether users
    find what they're searching for. With your consent, you're helping us to
    make our documentation better.
"""